services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      target: test
      args:
        STRICT_SSL: ${STRICT_SSL:-true}
    env_file:
      - .env.test
    environment:
      VITEST_WATCH_USE_POLLING: "true"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "51204:51204"
    stdin_open: true
    tty: true
    command: pnpm run test:ui:docker
